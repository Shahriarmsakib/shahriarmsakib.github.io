    Projects:
      - name: "EMG-Robust: stress-testing toolkit for EMG hand-pose models (paper submitted)"
        url: https://github.com/Shahriarmsakib/emg-robust-toolkit
        summary: Open-source toolkit that applies controlled perturbations (additive noise, channel dropout, amplitude scaling, temporal shift) to EMG pose-estimation models and reports how their accuracy degrades.
        highlights:
          - Evaluated on two public emg2pose baselines; models ranked by clean accuracy showed different failure profiles under perturbation.

